name = "ai-together-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGIN = "https://YOUR_GITHUB_USERNAME.github.io"

# 로컬 개발 시
# wrangler dev --local

# 환경변수는 wrangler secret put GEMINI_API_KEY 로 설정
# 또는 .dev.vars 파일에 GEMINI_API_KEY=... 로 설정 (git에 커밋하지 않음)
